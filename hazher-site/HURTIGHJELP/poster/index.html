<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hurtighjelp plakat</title>
<meta name="robots" content="noindex"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#f4f7fb;color:#0f2744;padding:24px}
  .wrap{max-width:720px;margin:0 auto}
  h1{margin:0 0 8px;font-size:1.6rem}
  p{color:#5a6b7d;line-height:1.45}
  .card{background:#fff;border:1px solid #d7e0eb;border-radius:16px;padding:18px;margin:16px 0}
  img{width:100%;max-width:320px;border-radius:12px;border:1px solid #d7e0eb;display:block;margin:12px auto}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  a.btn{text-decoration:none;padding:12px 14px;border-radius:12px;font-weight:700}
  .primary{background:#0f2744;color:#fff}
  .accent{background:#1a4f8b;color:#fff}
  .soft{background:#e8eef6;color:#0f2744}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hurtighjelp — plakat</h1>
  <p>Offisiell A4-plakat og avansert studio for egne design.</p>
  <div class="card">
    <strong>Offisiell plakat</strong>
    <img src="./preview.png" alt="Plakat forhåndsvisning"/>
    <div class="btns">
      <a class="btn primary" href="./hurtighjelp_plakat_a4.pdf" target="_blank" rel="noopener">Åpne / skriv ut PDF</a>
      <a class="btn accent" href="./studio/">Åpne plakat-studio</a>
      <a class="btn soft" href="../app/?store=stay">Nedlastingsside</a>
    </div>
  </div>
</div>
</body>
</html>

<script>
(function () {
  try {
    var origin = location.origin;
    var path = '/HURTIGHJELP/app/';
    var c = document.getElementById('hj-canonical');
    var u = document.getElementById('hj-og-url');
    var i = document.getElementById('hj-og-image');
    if (c) c.href = origin + path;
    if (u) u.setAttribute('content', origin + path);
    if (i) i.setAttribute('content', origin + '/images/hurtighjelp-app-icon.png');
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --primary: #5B4BFF;
    --ink: #1A1F36;
    --muted: #5A6478;
    --line: #E3E6EE;
    --bg: #F6F7FB;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .icon {
    width: 112px;
    height: 112px;
    border-radius: 26px;
    display: block;
    margin: 0 auto 28px;
    background: var(--white);
    box-shadow: 0 18px 40px rgba(26, 31, 54, 0.12);
  }
  h1 {
    font-family: Syne, sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    letter-spacing: -0.055em;
    line-height: 0.95;
  }
  .lead {
    margin: 14px auto 0;
    max-width: 28ch;
    color: var(--muted);
    font-size: 1.08rem;
    font-weight: 500;
    line-height: 1.45;
  }
  .status {
    display: none;
    margin: 22px auto 0;
    color: var(--primary);
    font-size: 0.92rem;
    font-weight: 700;
  }
  .status.is-on { display: block; }
  .actions {
    margin-top: 28px;
    display: grid;
    gap: 10px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    border-radius: 16px;
    padding: 16px 18px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.02em;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.985); }
  .btn svg { flex-shrink: 0; }
  .btn-apple { background: #111; color: #fff; }
  .btn-play { background: var(--primary); color: #fff; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.92rem;
    padding: 12px;
  }
  .hint {
    margin-top: 22px;
    color: #8A93A8;
    font-size: 0.84rem;
    line-height: 1.5;
  }
  footer {
    margin-top: 40px;
    color: #8A93A8;
    font-size: 0.78rem;
    font-weight: 600;
  }
</style>
<script>
(function () {
  var APPLE = 'https://apps.apple.com/no/app/hurtighjelp/id6768033731';
  var PLAY = 'https://play.google.com/store/apps/details?id=no.hurtighjelp.hurtighjelp_app&hl=no';
  var SUPABASE_URL = 'https://rueqwgcxmcukmvjdrnfc.supabase.co';
  var SUPABASE_ANON =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1ZXF3Z2N4bWN1a212amRybmZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NzE1MTgsImV4cCI6MjA5MjM0NzUxOH0.yKCGS98kbujl1gnaDdGCqc8Yy-GU-7eOSi1DArj_xf4';

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var platform = isIOS ? 'ios' : (isAndroid ? 'android' : 'other');
  var q = new URLSearchParams(location.search);
  var force = q.get('store');
  var campaign = (q.get('src') || q.get('campaign') || 'poster').slice(0, 64);
  var target = null;
  if (force === 'apple') target = APPLE;
  else if (force === 'play') target = PLAY;
  else if (force === 'stay') target = null;
  else if (isIOS) target = APPLE;
  else if (isAndroid) target = PLAY;

  function sessionId() {
    try {
      var k = 'hj_qr_sid';
      var v = localStorage.getItem(k);
      if (!v) {
        v = (crypto.randomUUID && crypto.randomUUID()) ||
          (Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
        localStorage.setItem(k, v);
      }
      return String(v).slice(0, 64);
    } catch (_) {
      return null;
    }
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(function (resolve) { setTimeout(function () { resolve(null); }, ms); })
    ]);
  }

  function fetchGeo() {
    return withTimeout(
      fetch('https://ipwho.is/', { method: 'GET', mode: 'cors' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || d.success === false) return null;
          return {
            country: d.country_code || d.country || null,
            region: d.region || null,
            city: d.city || null,
            latitude: typeof d.latitude === 'number' ? d.latitude : null,
            longitude: typeof d.longitude === 'number' ? d.longitude : null
          };
        })
        .catch(function () { return null; }),
      700
    );
  }

  function trackScan(geo) {
    var body = {
      p_platform: platform,
      p_campaign: campaign,
      p_user_agent: (ua || '').slice(0, 512),
      p_session_id: sessionId(),
      p_country: geo && geo.country ? String(geo.country).slice(0, 8) : null,
      p_region: geo && geo.region ? String(geo.region).slice(0, 80) : null,
      p_city: geo && geo.city ? String(geo.city).slice(0, 80) : null,
      p_latitude: geo && geo.latitude != null ? geo.latitude : null,
      p_longitude: geo && geo.longitude != null ? geo.longitude : null,
      p_is_test: false
    };
    return fetch(SUPABASE_URL + '/rest/v1/rpc/record_poster_qr_scan', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + SUPABASE_ANON
      },
      body: JSON.stringify(body),
      keepalive: true,
      mode: 'cors'
    }).catch(function () {});
  }

  window.__HJ_STORES__ = {
    apple: APPLE,
    play: PLAY,
    target: target,
    isIOS: isIOS,
    isAndroid: isAndroid,
    platform: platform
  };

  var trackPromise = fetchGeo().then(function (geo) {
    return trackScan(geo || null);
  });
  if (target && force !== 'stay') {
    Promise.race([
      trackPromise,
      new Promise(function (resolve) { setTimeout(resolve, 1200); })
    ]).then(function () {
      location.replace(target);
    });
  } else {
    trackPromise;
  }
})();
</script>

<body>
  <div class="page">
    <main>
      <img class="icon" src="/images/hurtighjelp-app-icon.png" width="112" height="112" alt="Hurtighjelp"/>
      <h1>Hurtighjelp</h1>
      <p class="lead">Få hjelp i nærheten — eller tjen på å hjelpe.</p>
      <p id="status" class="status" aria-live="polite">Sender deg til riktig butikk…</p>
      <div class="actions">
        <a id="btnApple" class="btn btn-apple" href="https://apps.apple.com/no/app/hurtighjelp/id6768033731">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.46 2.22-1.21 3.02-.79.84-2.1 1.49-3.2 1.4-.14-1.1.45-2.27 1.18-3.06.8-.87 2.2-1.5 3.23-1.36zM20.5 17.2c-.6 1.35-.88 1.95-1.65 3.14-1.07 1.64-2.58 3.68-4.45 3.7-1.66.02-2.09-1.08-4.35-1.07-2.26.01-2.73 1.1-4.39 1.08-1.87-.03-3.3-1.86-4.37-3.5C-.3 17.4-1.1 12.7.9 9.5c1.05-1.7 2.72-2.77 4.32-2.77 1.7 0 2.77 1.11 4.18 1.11 1.36 0 2.19-1.12 4.15-1.12 1.4 0 2.88.76 3.93 2.08-3.45 1.89-2.89 6.82.02 8.4z"/></svg>
          App Store
        </a>
        <a id="btnPlay" class="btn btn-play" href="https://play.google.com/store/apps/details?id=no.hurtighjelp.hurtighjelp_app&hl=no">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.2c-.4.2-.6.6-.6 1.1v17.4c0 .5.2.9.6 1.1l10.1-9.8L3.6 2.2zm12.2 7.1L13.1 7.7 4.8 2.8l9.5 9.2 1.5-2.7zm.7 1.3-1.8 1.7 1.8 1.7 2.5-1.4c.5-.3.5-.9 0-1.2l-2.5-.8zM4.8 21.2l8.3-4.9 2.7-2.6-11 7.5z"/></svg>
          Google Play
        </a>
        <a class="btn btn-ghost" href="/HURTIGHJELP/">Mer om Hurtighjelp</a>
      </div>
      <p class="hint">Skannet du plakaten? iPhone åpner App Store, Android åpner Google Play automatisk.</p>
    </main>
    <footer>hurtighjelpapp.no</footer>
  </div>
  <script>
  (function () {
    var s = window.__HJ_STORES__ || {};
    var status = document.getElementById('status');
    if (s.target) {
      status.textContent = s.isIOS
        ? 'Åpner App Store…'
        : (s.isAndroid ? 'Åpner Google Play…' : 'Åpner butikk…');
      status.classList.add('is-on');
    } else {
      status.textContent = 'Velg butikk under';
      status.classList.add('is-on');
    }
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Last ned Hurtighjelp</title>
<meta name="description" content="Last ned Hurtighjelp for iPhone eller Android — markedsplassen for lokal hjelp."/>
<meta name="theme-color" content="#0f2744"/>
<link rel="canonical" href="https://www.hazher.no/HURTIGHJELP/app/"/>
<meta property="og:title" content="Last ned Hurtighjelp"/>
<meta property="og:description" content="Markedsplassen for lokal hjelp — iOS og Android."/>
<meta property="og:url" content="https://www.hazher.no/HURTIGHJELP/app/"/>
<meta property="og:image" content="https://www.hazher.no/images/hurtighjelp-app-icon.png"/>
<link rel="icon" type="image/png" href="/images/hurtighjelp-app-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink: #0f2744;
    --muted: #5a6b7d;
    --line: #d7e0eb;
    --bg: #f4f7fb;
    --card: #ffffff;
    --accent: #1a4f8b;
    --wave: #0f2744;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 50% -8%, #dbe8f6 0%, transparent 60%),
      var(--bg);
    display: flex;
    flex-direction: column;
  }
  .page {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px 0;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px 26px 28px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(15, 39, 68, 0.08);
  }
  .icon {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    display: block;
    margin: 0 auto 18px;
    box-shadow: 0 8px 24px rgba(15, 39, 68, 0.14);
  }
  h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .tag {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 1rem;
    font-weight: 500;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0 18px;
    color: #9aa8b8;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .status {
    display: none;
    margin: 0 0 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #eef5ff;
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 600;
  }
  .status.is-on { display: block; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    border-radius: 14px;
    padding: 15px 16px;
    margin: 0 0 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { flex-shrink: 0; }
  .btn-apple { background: #111; color: #fff; }
  .btn-play { background: #01875f; color: #fff; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    font-weight: 600;
    font-size: 0.92rem;
    margin-top: 4px;
  }
  .hint {
    margin: 16px 0 0;
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.45;
  }
  .wave {
    margin-top: 36px;
    background: var(--wave);
    color: #fff;
    text-align: center;
    padding: 28px 20px 32px;
    clip-path: ellipse(120% 100% at 50% 100%);
  }
  .wave p {
    margin: 10px auto 0;
    max-width: 320px;
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.02em;
  }
  .wave svg { opacity: 0.9; }
</style>
<script>
(function () {
  var APPLE = 'https://apps.apple.com/no/app/hurtighjelp/id6768033731';
  var PLAY = 'https://play.google.com/store/apps/details?id=no.hurtighjelp.hurtighjelp_app&hl=no';
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var q = new URLSearchParams(location.search);
  var force = q.get('store'); // apple | play | stay
  var target = null;
  if (force === 'apple') target = APPLE;
  else if (force === 'play') target = PLAY;
  else if (force === 'stay') target = null;
  else if (isIOS) target = APPLE;
  else if (isAndroid) target = PLAY;

  window.__HJ_STORES__ = { apple: APPLE, play: PLAY, target: target, isIOS: isIOS, isAndroid: isAndroid };

  if (target && force !== 'stay') {
    location.replace(target);
  }
})();
</script>
</head>
<body>
  <div class="page">
    <main class="card">
      <img class="icon" src="/images/hurtighjelp-app-icon.png" width="84" height="84" alt="Hurtighjelp"/>
      <h1>Hurtighjelp</h1>
      <p class="tag">Markedsplassen for lokal hjelp</p>
      <div class="divider"><span>Last ned</span></div>
      <p id="status" class="status" aria-live="polite">Sender deg til riktig butikk…</p>
      <a id="btnApple" class="btn btn-apple" href="https://apps.apple.com/no/app/hurtighjelp/id6768033731">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.46 2.22-1.21 3.02-.79.84-2.1 1.49-3.2 1.4-.14-1.1.45-2.27 1.18-3.06.8-.87 2.2-1.5 3.23-1.36zM20.5 17.2c-.6 1.35-.88 1.95-1.65 3.14-1.07 1.64-2.58 3.68-4.45 3.7-1.66.02-2.09-1.08-4.35-1.07-2.26.01-2.73 1.1-4.39 1.08-1.87-.03-3.3-1.86-4.37-3.5C-.3 17.4-1.1 12.7.9 9.5c1.05-1.7 2.72-2.77 4.32-2.77 1.7 0 2.77 1.11 4.18 1.11 1.36 0 2.19-1.12 4.15-1.12 1.4 0 2.88.76 3.93 2.08-3.45 1.89-2.89 6.82.02 8.4z"/></svg>
        App Store
      </a>
      <a id="btnPlay" class="btn btn-play" href="https://play.google.com/store/apps/details?id=no.hurtighjelp.hurtighjelp_app&hl=no">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.2c-.4.2-.6.6-.6 1.1v17.4c0 .5.2.9.6 1.1l10.1-9.8L3.6 2.2zm12.2 7.1L13.1 7.7 4.8 2.8l9.5 9.2 1.5-2.7zm.7 1.3-1.8 1.7 1.8 1.7 2.5-1.4c.5-.3.5-.9 0-1.2l-2.5-.8zM4.8 21.2l8.3-4.9 2.7-2.6-11 7.5z"/></svg>
        Google Play
      </a>
      <a class="btn btn-ghost" href="https://www.hazher.no/HURTIGHJELP/">Mer om Hurtighjelp</a>
      <p class="hint">Skannet du plakaten? iPhone åpner App Store, Android åpner Google Play automatisk.</p>
    </main>
  </div>
  <footer class="wave">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M8 14c0 2 1.5 4 4 4s4-2 4-4"/>
      <path d="M7 11c-1.5-1-2-2.5-1.2-4 .7-1.2 2.2-1.5 3.2-.7L12 8l2.9-1.7c1-.8 2.5-.5 3.2.7.8 1.5.3 3-1.2 4"/>
      <path d="M9 15v2M15 15v2"/>
    </svg>
    <p>Trenger du en hånd, eller har du en å gi?</p>
  </footer>
  <script>
  (function () {
    var s = window.__HJ_STORES__ || {};
    var status = document.getElementById('status');
    if (s.target) {
      status.textContent = s.isIOS
        ? 'Åpner App Store…'
        : (s.isAndroid ? 'Åpner Google Play…' : 'Åpner butikk…');
      status.classList.add('is-on');
    } else {
      status.textContent = 'Velg butikk under';
      status.classList.add('is-on');
    }
  })();
  </script>
</body>
</html>
